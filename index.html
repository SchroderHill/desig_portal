<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DESIGN PORTAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.css" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" rel="stylesheet" type="text/css">
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: 'Times New Roman', Times, serif; }
    #header { position: absolute; top: 0; left: 0; right: 0; height: 50px; background: #494747; color: #070124; display: flex; justify-content: center; align-items: center; z-index: 2; font-size: 30px; }
    #map { position: absolute; top: 50px; left: 150px; right: 0; bottom: 0; }
    .mapboxgl-ctrl-geocoder { position: absolute; top: 10px; left: 50px; z-index: 2; width: 300px !important; }
    .mapboxgl-ctrl-geocoder input[type='text'] { font-size: 15px; width: 100%; }
    .mapboxgl-ctrl-geocoder--suggestion-title { font-weight: bold; }
    .mapboxgl-ctrl-geocoder--suggestion-address { font-size: 12px; }
    #layers-panel { margin-top: 14px; color: rgb(50, 48, 48); }
    #layers-panel h3 { margin: 0 0 6px; font-size: 18px; line-height: 1; }
    #layers-list div { margin: 5px 0; }
    .layer-toggle { margin-right: 8px; }
    .grade-label .mapboxgl-popup-content { background: rgba(188, 177, 177, 0.8); padding: 3px 6px; border-radius: 3px; font-size: 10px; text-align: center; min-width: auto; line-height: 1; transition: opacity 3.5s ease-in-out; }
    .area-label .mapboxgl-popup-content { background: rgba(255, 255, 255, 0.2); padding: 2px 4px; border-radius: 2px; font-size: 10px; text-align: center; min-width: auto; width: fit-content; line-height: 1; margin: 0; transition: opacity 0.5s ease-in-out; }
    .area-label .mapboxgl-popup-tip { display: none; }
    #sidebar { position: absolute; top: 50px; left: 0; width: 150px; bottom: 0; background: #7d7b7b; padding: 10px; z-index: 1; overflow-y: auto; }
    #sidebar button { display: block; width: 100%; margin: 5px 0; padding: 8px; background: #4a4a4a; color: white; border: none; border-radius: 3px; cursor: pointer; }
    #sidebar button:hover { background: #666; }
    #sidebar button:disabled { cursor: wait; opacity: 0.65; }
    #geopdf-status { min-height: 0; margin: 4px 0 8px; color: #fff; font: 11px/1.25 Arial, sans-serif; overflow-wrap: anywhere; }
    #geopdf-status:empty { display: none; }
    #geopdf-status[data-state="success"] { display: none; }
    #geopdf-status[data-state="error"] { color: #ffd1d1; }
    #geopdf-status[data-state="warning"] { color: #fff1a8; }
    .geopdf-layer { margin: 5px 0; padding: 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); font: 9px/1.15 Arial, sans-serif; }
    .geopdf-layer-heading { display: flex; gap: 3px; align-items: center; min-width: 0; margin-bottom: 2px; }
    .geopdf-layer-heading span { display: none; }
    .geopdf-visible { margin: 0; }
    .geopdf-opacity { display: grid; grid-template-columns: 32px 1fr; gap: 3px; align-items: center; margin-top: 2px; }
    .geopdf-opacity input { min-width: 0; width: 100%; height: 12px; }
    .geopdf-actions { display: grid; grid-template-columns: repeat(2, 44px); gap: 3px; margin-top: 3px; }
    #sidebar .geopdf-actions button { display: inline-block; width: 44px; margin: 0; padding: 2px 3px; font-size: 8px; line-height: 1; }
    .geopdf-meta { display: block; margin-top: 3px; color: #e8e8e8; font-size: 8px; line-height: 1.1; }
    .geopdf-meta-warning { color: #fff1a8; }
    #earthworks-legend { margin-top: 6px; padding: 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); color: #fff; font: 8px/1.1 Arial, sans-serif; }
    #earthworks-legend strong { display: block; margin-bottom: 2px; font-size: 8px; }
    .earthworks-key { display: flex; align-items: center; gap: 3px; margin-top: 1px; }
    .earthworks-swatch { width: 12px; height: 3px; border-radius: 3px; background: #9ca3af; }
    .earthworks-swatch--cut { background: #2eae62; }
    .earthworks-swatch--fill { background: #f28c28; }
    #road-analysis-status { margin-top: 5px; color: #fff; font: 10px/1.25 Arial, sans-serif; overflow-wrap: anywhere; }
    #road-analysis-status[data-state="error"] { color: #ffd1d1; }
    #sidebar #hillshade-toggle { width: auto; min-width: 64px; margin: 0 0 6px; padding: 3px 5px; font: 9px/1 Arial, sans-serif; background: #555; }
    #sidebar #hillshade-toggle[aria-pressed="true"] { background: #2f5e7d; }
    #sidebar button[hidden] { display: none; }
    .slope-rail #steep-slope-toggle { width: 44px; height: 44px; padding: 3px; color: #651414; font: bold 10px/1.2 Arial, sans-serif; }
    .slope-rail #steep-slope-toggle[aria-pressed="true"] { background: #b31217; color: white; box-shadow: inset 0 0 0 1px #ffb3b3; }
    #steep-slope-result { margin-top: 5px; padding: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); color: #fff; font: 9px/1.25 Arial, sans-serif; overflow-wrap: anywhere; }
    #steep-slope-result::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; background: rgba(215, 25, 28, 0.7); border: 1px solid #8b0000; }
    #steep-slope-status { margin-top: 5px; color: #fff; font: 10px/1.25 Arial, sans-serif; overflow-wrap: anywhere; }
    #steep-slope-status[data-state="error"] { color: #ffd1d1; }
    .mapbox-gl-draw_ctrl-draw-btn { border: none; cursor: pointer; display: block; width: 30px; height: 30px; background-color: #fff; padding: 2px; font-size: 20px; text-align: center; font-weight: bold; border-radius: 4px; }
    .mapbox-gl-draw_ctrl-draw-btn:hover { background-color: #1d1b1b; }
    .road-grade-chip { pointer-events: none; }
    .road-grade-chip .mapboxgl-popup-content { background: rgba(24,38,30,.88); color:#e8f8c8; padding:3px 5px; border-radius:3px; font:600 11px/1.2 system-ui,sans-serif; box-shadow:0 1px 3px #0003; white-space:nowrap; }
    .road-grade-chip .mapboxgl-popup-tip { display:none; }
    .road-grade-live .mapboxgl-popup-content { background:rgba(44,72,30,.94); color:white; }
  </style>
</head>
<body>
  <div id="header">Design Portal</div>
  <div id="sidebar">
    <button id="add-geopdf" type="button">Add GeoPDF</button>
    <input id="geopdf-file" type="file" accept=".pdf,application/pdf" hidden>
    <div id="geopdf-status" role="status" aria-live="polite"></div>
    <button id="draw-line">Draw Road</button>
    <button id="draw-polygon">Draw Pad</button>
    <button id="export">Export</button>
    <button id="slope-area" type="button">Use this view as slope area</button>
    <div id="slope-area-status" role="status" style="font:11px/1.3 Arial,sans-serif;margin:4px 0 8px;color:white"></div>
    <div id="layers-panel">
      <h3>Layers</h3>
      <button id="hillshade-toggle" type="button" aria-pressed="false">Hillshade</button>
      <div id="layers-list"></div>
    </div>
    <div id="steep-slope-result" role="status" aria-live="polite" hidden></div>
    <div id="steep-slope-status" role="status" aria-live="polite" hidden></div>
    <div id="earthworks-legend" hidden>
      <strong>Earthworks · Mapbox estimate</strong>
      <span class="earthworks-key"><i class="earthworks-swatch earthworks-swatch--cut"></i>Cut</span>
      <span class="earthworks-key"><i class="earthworks-swatch earthworks-swatch--fill"></i>Fill</span>
      <span class="earthworks-key"><i class="earthworks-swatch"></i>Balanced</span>
    </div>
    <div id="road-analysis-status" role="status" aria-live="polite" hidden></div>
  </div>
  <div id="map"></div>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoic2Nocm9kZXItaGlsbCIsImEiOiJjbHpmdW5ibXUxY3I1MmtvbXU3c2t0aHhoIn0.D_W59ZKzQSJf7WF8Cfhm3w';

    // --- STYLE CONFIGURATION ---
    const mapStyles = {
      satellite: 'mapbox://styles/mapbox/satellite-v9',
      contours: 'mapbox://styles/mapbox/outdoors-v12'
    };

    // LINZ Aerial Imagery API
    const LINZ_API_KEY = 'c01k1d80kejs44kkhx4d23zbwvg';

    const transitionZoom = {
      contoursStart: 14, // Start contours at zoom 14
      contoursEnd: 23   // Complete contours transition at zoom 23
    };

    const hillshadeOverlayOpacity = 1;
    let hillshadeEnabled = false;

    function updateMapOverlays() {
      const currentZoom = map.getZoom();

      if (currentZoom >= transitionZoom.contoursStart) {
        const contoursProgress = Math.min((currentZoom - transitionZoom.contoursStart) / (transitionZoom.contoursEnd - transitionZoom.contoursStart), 1);
        if (map.getLayer('contour-lines')) {
          map.setPaintProperty('contour-lines', 'line-opacity', contoursProgress);
        }
        if (map.getLayer('contour-labels')) {
          map.setPaintProperty('contour-labels', 'text-opacity', contoursProgress * 0.8);
        }
      } else {
        if (map.getLayer('contour-lines')) {
          map.setPaintProperty('contour-lines', 'line-opacity', 0);
        }
        if (map.getLayer('contour-labels')) {
          map.setPaintProperty('contour-labels', 'text-opacity', 0);
        }
      }

      if (map.getLayer('linz-hillshade-overlay-layer')) {
        map.setPaintProperty('linz-hillshade-overlay-layer', 'raster-opacity', hillshadeEnabled ? hillshadeOverlayOpacity : 0);
      }
    }

    // --- INITIALISE MAP ---
    const map = new mapboxgl.Map({
      container: 'map',
      style: mapStyles.satellite,
      hash: true,
      center: [173.95, -41.5],
      zoom: 5,
      fadeDuration: 300 // Smoother fade duration (milliseconds)
    });

    map.on('load', () => {
      // Add LINZ hillshade layer for close zoom levels
      map.addSource('linz-hillshade-overlay', {
        type: 'raster',
        tiles: [`https://basemaps.linz.govt.nz/v1/tiles/hillshade/WebMercatorQuad/{z}/{x}/{y}.png?api=${LINZ_API_KEY}`],
        tileSize: 256,
        maxzoom: 21,
        attribution: '© LINZ'
      });

      map.addLayer({
        id: 'linz-hillshade-overlay-layer',
        type: 'raster',
        source: 'linz-hillshade-overlay',
        paint: {
          'raster-opacity': 0,
          'raster-opacity-transition': {
            duration: 500
          }
        }
      });

      // Add contour/outdoor map overlay for medium zoom levels - VECTOR TILES VERSION
      map.addSource('mapbox-terrain-vector', {
        type: 'vector',
        url: 'mapbox://mapbox.mapbox-terrain-v2'
      });

      // Add only the contour lines as vector layer
      map.addLayer({
        id: 'contour-lines',
        type: 'line',
        source: 'mapbox-terrain-vector',
        'source-layer': 'contour',
        paint: {
          'line-color': '#ffff00',  // Bright yellow color for maximum visibility
          'line-width': [
            'interpolate',
            ['linear'],
            ['zoom'],
            14, 1.5,
            20, 4
          ],
          'line-opacity': 0
        }
      });

      // Add contour labels
      map.addLayer({
        id: 'contour-labels',
        type: 'symbol',
        source: 'mapbox-terrain-vector',
        'source-layer': 'contour',
        filter: ['has', 'ele'],
        layout: {
          'text-field': ['concat', ['get', 'ele'], 'm'],
          'text-font': ['DIN Pro Bold', 'Arial Unicode MS Bold'],
          'text-size': 14,
          'symbol-placement': 'line',
          'text-rotation-alignment': 'map',
          'text-allow-overlap': false,
          'text-ignore-placement': false
        },
        paint: {
          'text-color': '#ffff00',  // Bright yellow text for high visibility
          'text-halo-color': 'rgba(0,0,0,1)',
          'text-halo-width': 4,
          'text-opacity': 0
        }
      });

      updateMapOverlays();
    });

    // Handle zoom transitions - aerial imagery persists, while contours fade in with zoom.
    map.on('zoom', updateMapOverlays);

    // --- MAPBOX DRAW CONTROL ---
    const draw = new MapboxDraw({
      displayControlsDefault: false,
      controls: { trash: true },
      styles: [
        { "id": "gl-draw-line", "type": "line", "filter": ["all", ["==", "$type", "LineString"], ["!=", "mode", "static"]], "layout": { "line-cap": "round", "line-join": "round" }, "paint": { "line-color": "#b9ee63", "line-width": 3 }},
        { "id": "gl-draw-polygon-fill", "type": "fill", "filter": ["all", ["==", "$type", "Polygon"], ["!=", "mode", "static"]], "paint": { "fill-color": "#D20C0C", "fill-outline-color": "#D20C0C", "fill-opacity": 0.1 }},
        { "id": "gl-draw-polygon-stroke-active", "type": "line", "filter": ["all", ["==", "$type", "Polygon"], ["!=", "mode", "static"]], "layout": { "line-cap": "round", "line-join": "round" }, "paint": { "line-color": "#D20C0C", "line-dasharray": [0.2, 2], "line-width": 4 }}
      ]
    });
    map.addControl(draw);
    // A native Mapbox control keeps the slope toggle directly below the trash control.
    map.addControl({
      onAdd() {
        this.container = document.createElement('div');
        this.container.className = 'mapboxgl-ctrl mapboxgl-ctrl-group slope-rail';
        const button = document.createElement('button');
        button.id = 'steep-slope-toggle';
        button.type = 'button';
        button.textContent = 'Slope >35°';
        button.title = 'Show terrain steeper than 35 degrees';
        button.setAttribute('aria-pressed', 'false');
        this.container.appendChild(button);
        return this.container;
      },
      onRemove() { this.container.remove(); }
    }, 'top-right');
    window.designPortal = { map, draw };
    window.designPortalGeoPdf = window.designPortal;

    // --- GEOCODER CONTROL ---
    const geocoder = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: 'Search for any location',
      flyTo: {
        speed: 1.2,
        curve: 1,
        easing: t => t
      }
    });

    map.addControl(geocoder, 'top-left');

    // Buttons for draw modes
    document.getElementById('draw-line').addEventListener('click', () => {
      draw.changeMode('draw_line_string');
      showToast("Left click to draw · double click to finish.<br>Hold the scroll wheel and drag to pan.");
    });
    document.getElementById('draw-polygon').addEventListener('click', () => {
      draw.changeMode('draw_polygon');
      showToast("Left click to draw · double click to finish.<br>Hold the scroll wheel and drag to pan.");
    });
    document.getElementById('hillshade-toggle').addEventListener('click', event => {
      hillshadeEnabled = !hillshadeEnabled;
      event.currentTarget.setAttribute('aria-pressed', String(hillshadeEnabled));
      updateMapOverlays();
    });

    // --- TERRAIN & CUSTOM SOURCES/LAYERS ---
    const vertexLayerId = 'vertices';
    const vertexHitboxLayerId = 'vertices-hitbox';

    function addCustomLayers() {
      // DEM / terrain
      if (!map.getSource('mapbox-dem')) {
        map.addSource('mapbox-dem', { type: 'raster-dem', url: 'mapbox://mapbox.terrain-rgb', tileSize: 512, maxzoom: 14 });
        map.setTerrain({ source: 'mapbox-dem', exaggeration: 1 });
      }
      // Vertices layer
      if (!map.getSource(vertexLayerId)) {
        map.addSource(vertexLayerId, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      }
      if (!map.getLayer(vertexHitboxLayerId)) {
        map.addLayer({ id: vertexHitboxLayerId, type: 'circle', source: vertexLayerId, paint: { 'circle-radius': 14, 'circle-color': '#ffffff', 'circle-opacity': 0.01 } });
      }
      if (!map.getLayer(vertexLayerId)) {
        map.addLayer({ id: vertexLayerId, type: 'circle', source: vertexLayerId, paint: { 'circle-radius': 4.5, 'circle-color': '#b9ee63', 'circle-stroke-color': '#263e27', 'circle-stroke-width': 1.5 } });
      }
      // Grade‑label layer
      if (!map.getSource('grade-labels')) {
        map.addSource('grade-labels', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({ id: 'grade-labels', type: 'symbol', source: 'grade-labels', layout: { 'text-field': ['get', 'grade'], 'text-size': 18, 'text-allow-overlap': true, 'text-ignore-placement': true, 'text-anchor': 'center' }, paint: { 'text-color': 'rgba(260,0,0,1)' } });
      }
    }

    // Run once on initial load
    map.on('load', addCustomLayers);

    // --- PRIMARY PARCELS WFS CONFIG ---
const API_KEY = '3fb2e95f968e45fda09dc30805fa13a3';
const BASE_WFS = `https://data.linz.govt.nz/services;key=${API_KEY}/wfs`;

map.on('load', () => {
  map.addSource('parcels', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] }
  });
  
  map.addLayer({
    id: 'parcels-line',
    type: 'line',
    source: 'parcels',
    minzoom: 13,
    paint: {
      'line-color': '#000000',
      'line-width': 0.5
    }
  });
});

map.on('moveend', () => {
  if (map.getZoom() < 13) return;
  
  const bounds = map.getBounds();
  const bbox = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()].join(',');
  
  const url = `${BASE_WFS}`
    + `?service=WFS`
    + `&version=2.0.0`
    + `&request=GetFeature`
    + `&typeNames=layer-50772`
    + `&outputFormat=application/json`
    + `&bbox=${bbox},EPSG:4326`;

  fetch(url)
    .then(response => response.json())
    .then(data => {
      if (map.getSource('parcels')) {
        map.getSource('parcels').setData(data);
      }
    })
    .catch(err => console.error('WFS error:', err));
});

    // --- AREA POPUPS (unchanged) ---
    let areaPopup = null;
    map.on('draw.render', () => {
      if (draw.getMode() !== 'draw_polygon') return;
      const features = draw.getAll().features;
      const active = features[features.length - 1];
      if (!active || active.geometry.type !== 'Polygon') return;
      const coords = active.geometry.coordinates[0];
      if (coords.length < 3) return;
      const poly = turf.polygon([coords]);
      const areaText = `${Math.round(turf.area(poly))}m²`;
      const centroid = turf.centroid(poly);
      if (areaPopup) areaPopup.remove();
      const popup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false, className: 'area-label', anchor: 'center' })
        .setLngLat(centroid.geometry.coordinates).setHTML(areaText).addTo(map);
      areaPopup = popup;
      setTimeout(() => {
        const popupElement = popup.getElement();
        if (!popupElement) return;
        popupElement.style.opacity = '0';
        setTimeout(() => {
          popup.remove();
          if (areaPopup === popup) areaPopup = null;
        }, 500);
      }, 2500);
    });

    map.on('draw.create', e => {
      if (e.features[0].geometry.type === 'Polygon') {
        const feature = e.features[0]; const areaText = `${Math.round(turf.area(feature))}m²`; const centroid = turf.centroid(feature);
        if (areaPopup) areaPopup.remove();
        areaPopup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false, className: 'area-label', anchor: 'center' })
          .setLngLat(centroid.geometry.coordinates).setHTML(areaText).addTo(map);
      }
    });
    map.on('draw.update', e => {
      if (e.features[0].geometry.type === 'Polygon') {
        const feature = e.features[0]; const areaText = `${Math.round(turf.area(feature))}m²`; const centroid = turf.centroid(feature);
        if (areaPopup) areaPopup.remove();
        areaPopup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false, className: 'area-label', anchor: 'center' })
          .setLngLat(centroid.geometry.coordinates).setHTML(areaText).addTo(map);
      }
    });

    // --- VERTEX & GRADE‑LABELS UPDATE ---
    const roadLabels = new Map();
    function updateGradeLabels() {
      const wanted = new Set();
      const drawing = draw.getMode() === 'draw_line_string';
      const roads = draw.getAll().features.filter(f => f.geometry.type === 'LineString');
      const selected = new Set(draw.getSelectedIds());
      const label = (key, coordinate, text, live = false, total = false) => {
        wanted.add(key);
        let popup = roadLabels.get(key);
        if (!popup) {
          popup = new mapboxgl.Popup({closeButton:false,closeOnClick:false,
            className:'road-grade-chip',anchor:total?'top':'bottom',offset:total?14:10})
            .setLngLat(coordinate).setText(text).addTo(map);
          roadLabels.set(key,popup);
        }
        popup.setLngLat(coordinate).setText(text);
        popup.getElement().classList.toggle('road-grade-live',live);
      };
      roads.forEach((f, roadIndex) => {
        const coords=f.geometry.coordinates;
        let total=0;
        for(let i=1;i<coords.length;i++) {
          const a=coords[i-1],b=coords[i];
          const metres=turf.distance(turf.point(a),turf.point(b),{units:'kilometers'})*1000;
          if(metres<0.01)continue;
          total+=metres;
          const z1=map.queryTerrainElevation(a,{exaggerated:false});
          const z2=map.queryTerrainElevation(b,{exaggerated:false});
          const grade=Number.isFinite(z1)&&Number.isFinite(z2)?(z2-z1)/metres*100:null;
          const text=grade===null?'—':`${grade<0?'−':'+'}${Math.abs(grade).toFixed(1)}%`;
          label(`${f.id}:${i}`,[(a[0]+b[0])/2,(a[1]+b[1])/2],text,
            drawing && roadIndex===roads.length-1 && i===coords.length-1);
        }
        if(coords.length>1 && (!drawing || selected.has(f.id))) {
          label(`${f.id}:total`,coords[Math.floor((coords.length-1)/2)],
            `${f.properties.name||'Road'} · ${total.toFixed(1)} m`,false,true);
        }
      });
      for(const [key,popup] of roadLabels)if(!wanted.has(key)){popup.remove();roadLabels.delete(key);}
    }
    map.on('moveend',updateGradeLabels);
    map.on('idle',updateGradeLabels);
    map.on('draw.modechange',updateGradeLabels);

    function updateVertices() {
      if (!map.getSource('vertices')) return;
      const features = draw.getAll().features;
      const vertexFeatures = [];
      features.forEach(feature => {
        if (feature.geometry.type === 'LineString') {
          feature.geometry.coordinates.forEach((coord, idx) => {
            vertexFeatures.push({ type: 'Feature', geometry: { type: 'Point', coordinates: coord }, properties: { id: feature.id, index: idx } });
          });
        } else if (feature.geometry.type === 'Polygon') {
          feature.geometry.coordinates[0].forEach((coord, idx, arr) => {
            // Skip duplicate closing vertex if it is identical to the first vertex
            if (idx === arr.length - 1 && JSON.stringify(coord) === JSON.stringify(arr[0])) return;
            vertexFeatures.push({ type: 'Feature', geometry: { type: 'Point', coordinates: coord }, properties: { id: feature.id, type: 'Polygon', index: idx } });
          });
        }
      });
      map.getSource('vertices').setData({ type: 'FeatureCollection', features: vertexFeatures });
      updateGradeLabels();
    }

    map.on('draw.render', updateVertices);

    // Vertex drag handlers
    let draggedVertex = null;
    let vertexDragPanWasEnabled = false;

    function finishVertexDrag() {
      if (!draggedVertex) return;
      const changedFeature = draggedVertex.feature;
      draggedVertex = null;
      map.fire('draw.update', {features:[changedFeature], action:'change_coordinates'});
      if (vertexDragPanWasEnabled) map.dragPan.enable();
      map.getCanvas().style.cursor = '';
    }

    map.on('mousedown', vertexHitboxLayerId, e => {
      if (!e.features.length || e.originalEvent.button !== 0 || draw.getMode().startsWith('draw_')) return;
      e.preventDefault();
      e.originalEvent.stopPropagation();
      vertexDragPanWasEnabled = map.dragPan.isEnabled();
      if (vertexDragPanWasEnabled) map.dragPan.disable();
      draggedVertex = { feature: draw.get(e.features[0].properties.id), index: e.features[0].properties.index };
      map.getCanvas().style.cursor = 'grabbing';
    });
    map.on('mousemove', e => {
      if (!draggedVertex) return;
      const feature = draggedVertex.feature;
      if (feature.geometry.type === 'Polygon') {
        feature.geometry.coordinates[0][draggedVertex.index] = [e.lngLat.lng, e.lngLat.lat];
      } else {
        feature.geometry.coordinates[draggedVertex.index] = [e.lngLat.lng, e.lngLat.lat];
      }
      // Update the feature in Mapbox Draw
      draw.add(feature);
      updateVertices();
    });
    map.on('mouseup', finishVertexDrag);
    window.addEventListener('mouseup', finishVertexDrag);
    map.on('mousemove', vertexHitboxLayerId, () => {
      if (!draggedVertex) map.getCanvas().style.cursor = 'move';
    });
    map.on('mouseover', vertexHitboxLayerId, () => {
      map.getCanvas().style.cursor = 'move'; // Shows 4-sided arrow cursor
    });

    map.on('mouseout', vertexHitboxLayerId, () => {
      if (!draggedVertex) {
        map.getCanvas().style.cursor = '';
      }
    });

    // Add global counters for layer naming
let roadCount = 0;
let padCount = 0;
// Layer toggle / selection logic
map.on('draw.create', e => {
  const f = e.features[0];
  let displayName;
  if (f.geometry.type === 'LineString') {
    roadCount++;
    displayName = `Road ${roadCount}`;
  } else {
    padCount++;
    displayName = `Pad ${padCount}`;
  }
  const layerId = `drawn-${f.geometry.type}-${Date.now()}`;
  draw.setFeatureProperty(f.id, 'name', displayName);
  const toggleDiv = document.createElement('div');
  // Create the toggle div with a data attribute for the feature ID
  toggleDiv.setAttribute('data-feature-id', f.id);
  toggleDiv.innerHTML = `<input type="checkbox" id="${layerId}-toggle" class="layer-toggle">
                            <label for="${layerId}-toggle">${displayName}</label>`;
  document.getElementById('layers-list').appendChild(toggleDiv);
  // Checkbox now only controls selection
  document.getElementById(`${layerId}-toggle`).addEventListener('change', ev => {
    if (ev.target.checked) {
      draw.changeMode('simple_select', { featureIds: [f.id] });
      map.fire('road.popup.open', { roadId: f.id });
    } else {
      draw.changeMode('simple_select', { featureIds: [] });
    }
  });
  updateGradeLabels();
});

    // Handle deletion events from MapboxDraw
    map.on('draw.delete', e => {
      e.features.forEach(feature => {
        const toggleDiv = document.querySelector(`[data-feature-id="${feature.id}"]`);
        if (toggleDiv) toggleDiv.remove();
      });
      updateGradeLabels();
      map.resize();
    });

    // Custom trash button - modified to delete only selected features
    const trashBtn = document.querySelector('.mapbox-gl-draw_ctrl-draw-btn.mapbox-gl-draw_trash');
    if (trashBtn) {
      trashBtn.addEventListener('click', ev => {
        ev.stopPropagation();
        ev.preventDefault();
        
        // Get selected features
        const selectedFeatures = draw.getSelected();
        if (selectedFeatures.features.length > 0) {
          draw.delete(selectedFeatures.features.map(f => f.id));
        }
      });
    }

    // Update checkboxes when features are selected/deselected
    map.on('draw.selectionchange', e => {
      // Uncheck all checkboxes first
      document.querySelectorAll('.layer-toggle').forEach(checkbox => {
        checkbox.checked = false;
      });
      
      // Check boxes for selected features
      const selected = e.features;
      selected.forEach(feature => {
        const toggleDiv = document.querySelector(`[data-feature-id="${feature.id}"]`);
        if (toggleDiv) {
          const checkbox = toggleDiv.querySelector('.layer-toggle');
          if (checkbox) checkbox.checked = true;
        }
      });
    });

// Update toast functionality to center the message
function showToast(message, duration = 3000) {
  const toast = document.createElement('div');
  toast.innerHTML = message;
  toast.style.position = 'fixed';
  toast.style.top = '50%';         // changed from bottom to top 50%
  toast.style.left = '50%';
  toast.style.transform = 'translate(-50%, -50%)';  // center both horizontally & vertically
  toast.style.background = 'rgba(0,0,0,0.7)';
  toast.style.color = '#fff';
  toast.style.padding = '10px 20px';
  toast.style.borderRadius = '5px';
  toast.style.fontSize = '14px';
  toast.style.zIndex = '9999';
  document.body.appendChild(toast);
  setTimeout(() => { toast.remove(); }, duration);
}
