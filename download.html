<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="referrer" content="no-referrer"><title>Design Portal package</title>
<style>body{max-width:600px;margin:10vh auto;padding:24px;font:16px/1.5 system-ui;color:#26332a}button{padding:12px 20px;background:#294632;color:white;border:0;border-radius:5px}</style>
<h1>Design Portal package</h1><p>This private link downloads the submitted design files.</p><button id="download">Download package</button><p id="status" role="status"></p>
<script type="module">
const token=location.hash.slice(1),button=document.querySelector('#download'),status=document.querySelector('#status');
button.onclick=async()=>{button.disabled=true;try{if(!/^[a-f0-9]{64}$/.test(token))throw Error('Invalid package link.');
const base='/.netlify/functions/design-packages?token='+token;
const response=await fetch(base);if(!response.ok)throw Error('Package is unavailable. Contact Schroder Hill with your submission reference.');
const info=await response.json(),parts=[];for(let i=0;i<info.count;i++){status.textContent=`Downloading ${i+1} / ${info.count}…`;const part=await fetch(base+'&part='+i);if(!part.ok)throw Error('Download interrupted. Please retry.');parts.push(await part.arrayBuffer());}
const blob=new Blob(parts,{type:'application/zip'});if(blob.size!==info.size)throw Error('Incomplete package. Please retry.');
const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=info.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='Package downloaded.';
}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};
</script></html>
